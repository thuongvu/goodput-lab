[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodput-lab"
version = "0.0.0"
description = "One-GPU stock vLLM serving game day"
requires-python = ">=3.10"
dependencies = [
    "prometheus_client>=0.21.0",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goodput_lab = ["fixtures/*.csv", "data/gitkeep", "run.sh"]
